axial_fov: 15  #15
z_crystal_size: 0.152                                   
transaxial_crystal_size: 0.152             
crystal_thickness: 1 
energy_resolution: 17 
num_aa_bins: 108   #108    #116                       
num_td_bins: 256   #256    #232     
min_energy_window: 375 
max_energy_window: 664 
coincidence_window: 12 
numberOfSubsets: 1 
numberOfIterations: 48 
savingInterval: 16
analytical_att_correction: 0
stir_recons_att_corr: 1
analytic_scatt_corr_factor: 0.15
stir_scatt_corr_smoothing: 0
stir_scatt_simulation: 0
analytic_randoms_corr_factor: 0.2
stir_randoms_corr_smoothing: 0
