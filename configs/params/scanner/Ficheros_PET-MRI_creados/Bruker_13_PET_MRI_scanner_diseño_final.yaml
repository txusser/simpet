add_noise: 0                       #Como en el anterior filtrado se elimina el ruido, añadimos este analíticamente.
max_segment: 97  #97                         
zoomFactor: 1    # 0.6551                   # 0.795 para pixel de 0.75mm
xyOutputSize: 180   #120                  
zOutputSize:  200                  
zOutputVoxelSize: 3.27             # Esto no se usa  per ahora por defecto es la mitad del tamaño del cristal o sea 0.22/2 = 1.1 mm

# NOTAS

# El pixel en z corresponde a la mitad del tamaño del cristal.
# El pixel en x,y viene asociado al zoom factor.

